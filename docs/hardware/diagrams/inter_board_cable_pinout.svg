<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" width="1100" height="920">
<defs>
  <filter id="textshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feFlood flood-color="white" flood-opacity="0.9" result="bg"/>
    <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="dilated"/>
    <feComposite in="bg" in2="dilated" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .title { font: bold 16px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .subtitle { font: 11px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .label { font: bold 10px "SF Mono", Consolas, monospace; fill: #1a1a1a; filter: url(#textshadow); }
    .value { font: 9px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .pin { font: 10px "SF Mono", Consolas, monospace; fill: #555; filter: url(#textshadow); }
    .anno { font: 9px "SF Mono", Consolas, monospace; fill: #0066CC; filter: url(#textshadow); }
    .wire-trig { stroke: #FF5722; stroke-width: 2; fill: none; }
    .wire-data { stroke: #2196F3; stroke-width: 2; fill: none; }
    .wire-clk { stroke: #4CAF50; stroke-width: 2; fill: none; }
    .wire-res { stroke: #9C27B0; stroke-width: 2; fill: none; }
    .wire-aux { stroke: #FFC107; stroke-width: 2; fill: none; }
  </style>
</defs>
<rect width="1100" height="920" fill="#FEFEFE"/>
<text x="550" y="25" class="title" text-anchor="middle">ML-303 V5 Inter-Board Cable — DIGITAL_CON1 Pinout</text>
<text x="550" y="42" class="subtitle" text-anchor="middle">10-pin cable, sequencer board (PIC18LF452) → analog board (IC9 74174 + drum trigger + aux). All TTL signals; no power, no GND.</text>

<!-- PIC18LF452 box -->
<rect x="50" y="80" width="260" height="500" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="180" y="105" class="label" text-anchor="middle" fill="#FFF" font-size="13">PIC18LF452</text>
<text x="180" y="122" class="value" text-anchor="middle" fill="#CCC" font-size="9">40-pin DIP · digital board</text>

<!-- DIGITAL_CON1 connector box -->
<rect x="430" y="80" width="130" height="500" fill="#FBC02D" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="495" y="105" class="label" text-anchor="middle" fill="#1a1a1a" font-size="12">DIGITAL_CON1</text>
<text x="495" y="122" class="value" text-anchor="middle" fill="#1a1a1a" font-size="9">10-pin · RM 2.54</text>

<!-- Analog endpoint box -->
<rect x="680" y="80" width="370" height="500" fill="#0D47A1" stroke="#1a1a1a" stroke-width="2" rx="4"/>
<text x="865" y="105" class="label" text-anchor="middle" fill="#FFF" font-size="13">Analog Board</text>
<text x="865" y="122" class="value" text-anchor="middle" fill="#CCC" font-size="9">IC9 (74174) + drum-trigger conditioning + aux</text>

<!-- Row 1: pin 1 = RB7 = DRUM_TRIG -->
<text x="295" y="164" class="pin" text-anchor="end" fill="#FFF">pin 40 · RB7</text>
<circle cx="310" cy="160" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,160 L435,160" class="wire-trig"/>
<circle cx="430" cy="160" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="164" class="label" text-anchor="middle" fill="#1a1a1a">1</text>
<circle cx="560" cy="160" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,160 L685,160" class="wire-trig"/>
<circle cx="685" cy="160" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="158" class="value" fill="#FFF" font-size="9">DRUM_TRIG</text>
<text x="695" y="172" class="value" fill="#CCC" font-size="8">D101 (1N4148) → R182 (1 kΩ) → drum output</text>

<!-- Row 2: pin 2 = RB6 = data bit -->
<text x="295" y="204" class="pin" text-anchor="end" fill="#FFF">pin 39 · RB6</text>
<circle cx="310" cy="200" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,200 L435,200" class="wire-data"/>
<circle cx="430" cy="200" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="204" class="label" text-anchor="middle" fill="#1a1a1a">2</text>
<circle cx="560" cy="200" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,200 L685,200" class="wire-data"/>
<circle cx="685" cy="200" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="198" class="value" fill="#FFF" font-size="9">pitch DAC bit</text>
<text x="695" y="212" class="value" fill="#CCC" font-size="8">IC9 D-input · part of 6-bit pitch latch</text>

<!-- Row 3: pin 3 = RB5 -->
<text x="295" y="244" class="pin" text-anchor="end" fill="#FFF">pin 38 · RB5</text>
<circle cx="310" cy="240" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,240 L435,240" class="wire-data"/>
<circle cx="430" cy="240" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="244" class="label" text-anchor="middle" fill="#1a1a1a">3</text>
<circle cx="560" cy="240" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,240 L685,240" class="wire-data"/>
<circle cx="685" cy="240" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="238" class="value" fill="#FFF" font-size="9">pitch DAC bit</text>
<text x="695" y="252" class="value" fill="#CCC" font-size="8">IC9 D-input</text>

<!-- Row 4: pin 4 = RB4 -->
<text x="295" y="284" class="pin" text-anchor="end" fill="#FFF">pin 37 · RB4</text>
<circle cx="310" cy="280" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,280 L435,280" class="wire-data"/>
<circle cx="430" cy="280" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="284" class="label" text-anchor="middle" fill="#1a1a1a">4</text>
<circle cx="560" cy="280" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,280 L685,280" class="wire-data"/>
<circle cx="685" cy="280" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="278" class="value" fill="#FFF" font-size="9">pitch DAC bit</text>
<text x="695" y="292" class="value" fill="#CCC" font-size="8">IC9 D-input</text>

<!-- Row 5: pin 5 = RB3 -->
<text x="295" y="324" class="pin" text-anchor="end" fill="#FFF">pin 36 · RB3</text>
<circle cx="310" cy="320" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,320 L435,320" class="wire-data"/>
<circle cx="430" cy="320" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="324" class="label" text-anchor="middle" fill="#1a1a1a">5</text>
<circle cx="560" cy="320" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,320 L685,320" class="wire-data"/>
<circle cx="685" cy="320" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="318" class="value" fill="#FFF" font-size="9">pitch DAC bit</text>
<text x="695" y="332" class="value" fill="#CCC" font-size="8">IC9 D-input</text>

<!-- Row 6: pin 6 = RB2 -->
<text x="295" y="364" class="pin" text-anchor="end" fill="#FFF">pin 35 · RB2</text>
<circle cx="310" cy="360" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,360 L435,360" class="wire-data"/>
<circle cx="430" cy="360" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="364" class="label" text-anchor="middle" fill="#1a1a1a">6</text>
<circle cx="560" cy="360" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,360 L685,360" class="wire-data"/>
<circle cx="685" cy="360" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="358" class="value" fill="#FFF" font-size="9">pitch DAC bit</text>
<text x="695" y="372" class="value" fill="#CCC" font-size="8">IC9 D-input</text>

<!-- Row 7: pin 7 = RB1 -->
<text x="295" y="404" class="pin" text-anchor="end" fill="#FFF">pin 34 · RB1</text>
<circle cx="310" cy="400" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,400 L435,400" class="wire-data"/>
<circle cx="430" cy="400" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="404" class="label" text-anchor="middle" fill="#1a1a1a">7</text>
<circle cx="560" cy="400" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,400 L685,400" class="wire-data"/>
<circle cx="685" cy="400" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="398" class="value" fill="#FFF" font-size="9">pitch DAC bit</text>
<text x="695" y="412" class="value" fill="#CCC" font-size="8">IC9 D-input · 6th of 6 bits to 74174</text>

<!-- Row 8: pin 8 = RB0 = CLK -->
<text x="295" y="444" class="pin" text-anchor="end" fill="#FFF">pin 33 · RB0</text>
<circle cx="310" cy="440" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,440 L435,440" class="wire-clk"/>
<circle cx="430" cy="440" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="444" class="label" text-anchor="middle" fill="#1a1a1a">8</text>
<circle cx="560" cy="440" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,440 L685,440" class="wire-clk"/>
<circle cx="685" cy="440" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="438" class="value" fill="#FFF" font-size="9">CLK</text>
<text x="695" y="452" class="value" fill="#CCC" font-size="8">IC9 pin 9 · rising edge latches D1–D6</text>

<!-- Row 9: pin 9 = RA5 = /MR -->
<text x="295" y="484" class="pin" text-anchor="end" fill="#FFF">pin 7 · RA5</text>
<circle cx="310" cy="480" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,480 L435,480" class="wire-res"/>
<circle cx="430" cy="480" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="484" class="label" text-anchor="middle" fill="#1a1a1a">9</text>
<circle cx="560" cy="480" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,480 L685,480" class="wire-res"/>
<circle cx="685" cy="480" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="478" class="value" fill="#FFF" font-size="9">/MR (reset, active low)</text>
<text x="695" y="492" class="value" fill="#CCC" font-size="8">IC9 pin 1 · clears Q1–Q6 to 0</text>

<!-- Row 10: pin 10 = RA3 = aux -->
<text x="295" y="524" class="pin" text-anchor="end" fill="#FFF">pin 5 · RA3</text>
<circle cx="310" cy="520" r="5" fill="gold" stroke="#B8860B"/>
<path d="M315,520 L435,520" class="wire-aux"/>
<circle cx="430" cy="520" r="5" fill="gold" stroke="#B8860B"/>
<text x="495" y="524" class="label" text-anchor="middle" fill="#1a1a1a">10</text>
<circle cx="560" cy="520" r="5" fill="gold" stroke="#B8860B"/>
<path d="M565,520 L685,520" class="wire-aux"/>
<circle cx="685" cy="520" r="5" fill="gold" stroke="#B8860B"/>
<text x="695" y="518" class="value" fill="#FFF" font-size="9">aux control (NOT GND)</text>
<text x="695" y="532" class="value" fill="#CCC" font-size="8">lands outside 74174 · likely SLIDE / ACCENT / GATE → IC13a</text>

<!-- Direction arrow / note -->
<text x="495" y="555" class="anno" text-anchor="middle" font-size="9">all signals flow digital → analog →</text>

<!-- Notes block (split: pinout key + risk warning) -->
<rect x="50" y="600" width="500" height="300" fill="#F5F5F5" stroke="#666" stroke-width="0.5" rx="4"/>
<text x="300" y="622" class="label" text-anchor="middle">Pitch DAC chain</text>
<text x="65" y="644" class="value" font-size="9">PIC writes a 6-bit value onto pins 2–7, pulses pin 8 (CLK), and</text>
<text x="65" y="660" class="value" font-size="9">IC9 (74174 hex D flip-flop) latches it. The Q1–Q6 outputs drive</text>
<text x="65" y="676" class="value" font-size="9">an R-2R-style precision divider (MPR 200 kΩ network) to produce</text>
<text x="65" y="692" class="value" font-size="9">the 6-bit / 64-note pitch CV called out in 303xmas.pdf p.56.</text>
<text x="65" y="720" class="label" font-size="10">V5 cable orientation (from readme.txt)</text>
<text x="65" y="740" class="value" font-size="9">"Wie Ihr seht wird immer der linke PIN vom Analog-Board mit dem</text>
<text x="65" y="756" class="value" font-size="9">rechten PIN vom Sequenzer-Board verbunden."</text>
<text x="65" y="776" class="value" font-size="9">The boards face each other with mirrored pin orderings — pin 1 is</text>
<text x="65" y="792" class="value" font-size="9">on the LEFT of one connector and the RIGHT of the other. The</text>
<text x="65" y="808" class="value" font-size="9">electrical map is still 1↔1 by pin number end-to-end. Cables wired</text>
<text x="65" y="824" class="value" font-size="9">by physical position rather than pin number end up reversed.</text>
<text x="65" y="852" class="label" font-size="10">Continuity check (cable disconnected at both ends)</text>
<text x="65" y="872" class="value" font-size="9">For N = 1..10: probe pin N on connector A → confirm pin N on</text>
<text x="65" y="888" class="value" font-size="9">connector B beeps. Wire colour means nothing on a re-spliced cable.</text>

<rect x="570" y="600" width="480" height="300" fill="#FFEBEE" stroke="#D44" stroke-width="0.5" rx="4"/>
<text x="810" y="622" class="label" text-anchor="middle" fill="#D44">Risk for THIS cable: low</text>
<text x="585" y="644" class="value" font-size="9">All 10 lines are TTL signals between CMOS GPIOs (0–5 V). No power</text>
<text x="585" y="660" class="value" font-size="9">rail, no ground reference on this cable — power and GND travel on</text>
<text x="585" y="676" class="value" font-size="9">the SEPARATE 2-pin "Spannungsversorgung Digital" cable.</text>
<text x="585" y="696" class="value" font-size="9">• Two signal pins swapped: scrambled scale, wrong notes, drum</text>
<text x="585" y="710" class="value" font-size="9">  trigger fires on wrong bit, latch stuck in reset. No damage.</text>
<text x="585" y="724" class="value" font-size="9">• Two outputs driving each other (one high, one low): ~10 mA</text>
<text x="585" y="738" class="value" font-size="9">  short through CMOS drivers. Brief exposure usually fine.</text>
<text x="585" y="752" class="value" font-size="9">• Cable plugged in reversed end-to-end: drum trig lands on a data</text>
<text x="585" y="766" class="value" font-size="9">  line, reset lands on drum trig, etc. Non-destructive.</text>

<text x="810" y="800" class="label" text-anchor="middle" fill="#D44">⚠ The dangerous cable is the 2-pin power harness</text>
<text x="585" y="822" class="value" font-size="9">"DAS NEUE SEQUENZER-BOARD IST NICHT VERPOLUNGSSICHER!"</text>
<text x="585" y="838" class="value" font-size="9">(V5 readme.txt — no reverse-polarity protection on the digital</text>
<text x="585" y="852" class="value" font-size="9">board.) The 2-pin cable carries ~6 V from the 7806 regulator on</text>
<text x="585" y="866" class="value" font-size="9">the analog board to the PIC's VDD (pins 11 and 32). Reversed →</text>
<text x="585" y="880" class="value" font-size="9">−6 V on VDD → instant PIC failure. Continuity-check that cable</text>
<text x="585" y="896" class="value" font-size="9">with the same care; confirm the +V lug at both ends before plugging in.</text>
</svg>
